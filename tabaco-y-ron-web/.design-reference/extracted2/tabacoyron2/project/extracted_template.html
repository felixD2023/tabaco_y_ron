<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #121212;
    --bg-3: #1a1a1a;
    --line: rgba(200, 169, 106, 0.18);
    --line-strong: rgba(200, 169, 106, 0.45);
    --gold: #c8a96a;
    --gold-bright: #e3c889;
    --red: #b91c1c;
    --red-deep: #8a0f0f;
    --cream: #f5f1e8;
    --cream-mute: #b8b1a0;
    --muted: #6f6857;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--cream); font-family: var(--sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 400; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; line-height: 1.6; }
  ::selection { background: var(--gold); color: var(--bg); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a2418; border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* App */
  #root { min-height: 100vh; }

  /* Utility */
  .container { max-width: 1440px; margin: 0 auto; padding: 0 56px; }
  @media (max-width: 1024px) { .container { padding: 0 32px; } }
  @media (max-width: 720px)  { .container { padding: 0 20px; } }

  /* Section spacing — duplicated below for legibility */

  .eyebrow {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .eyebrow.cream { color: var(--cream-mute); }

  .hairline { height: 1px; background: var(--line); width: 100%; }

  /* Placeholder system — replaces real photography */
  .ph {
    position: relative;
    overflow: hidden;
    background: #161310;
    color: var(--gold);
    isolation: isolate;
  }
  .ph::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(200,169,106,0.18), transparent 55%),
      radial-gradient(ellipse at 75% 75%, rgba(185,28,28,0.22), transparent 50%),
      linear-gradient(180deg, #1a1611 0%, #0c0a07 100%);
    z-index: 0;
  }
  .ph::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(200,169,106,0.04) 0 1px, transparent 1px 14px);
    z-index: 1;
  }
  .ph-label {
    position: absolute;
    bottom: 14px; left: 14px;
    z-index: 5;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(245,241,232,0.55);
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid rgba(245,241,232,0.18);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(2px);
  }
  .ph-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    /* Treatment that unifies all stock images into a cohesive noir/tobacco look */
    filter: sepia(0.25) brightness(0.78) contrast(1.08) saturate(0.95);
  }
  .ph-overlay {
    position: absolute; inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(200,169,106,0.12), transparent 60%),
      radial-gradient(ellipse at center, transparent 35%, rgba(10,10,10,0.45) 100%),
      linear-gradient(180deg, rgba(10,10,10,0.10) 0%, rgba(10,10,10,0.30) 100%);
    pointer-events: none;
  }

  /* Product mode — imágenes reales de catálogo sobre fondo cream */
  .ph.ph-product {
    background: linear-gradient(180deg, #efe6d6 0%, #e2d6bf 100%);
    overflow: hidden;
    isolation: isolate;
  }
  .ph.ph-product::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.6), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(80,55,30,0.15), transparent 60%);
    z-index: 0;
  }
  .ph.ph-product::after { display: none; }
  .ph-img-product {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    object-position: center;
    z-index: 2;
    padding: 8%;
    filter: drop-shadow(0 18px 28px rgba(40,20,10,0.28));
  }
  .ph.warm::before {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(227,200,137,0.22), transparent 55%),
      radial-gradient(ellipse at 60% 90%, rgba(139,90,43,0.35), transparent 55%),
      linear-gradient(180deg, #1c140c 0%, #0a0805 100%);
  }
  .ph.smoke::before {
    background:
      radial-gradient(ellipse at 20% 80%, rgba(245,241,232,0.08), transparent 50%),
      radial-gradient(ellipse at 75% 30%, rgba(200,169,106,0.10), transparent 55%),
      linear-gradient(180deg, #0e0c0a 0%, #050403 100%);
  }
  .ph.crimson::before {
    background:
      radial-gradient(ellipse at 35% 55%, rgba(185,28,28,0.30), transparent 55%),
      radial-gradient(ellipse at 80% 20%, rgba(200,169,106,0.12), transparent 55%),
      linear-gradient(180deg, #1a0d0d 0%, #0a0505 100%);
  }

  /* Logo */
  .logo-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: var(--cream);
    font-family: var(--serif);
    font-weight: 700;
    font-style: italic;
    border-radius: 999px;
    padding: 7px 18px 9px;
    letter-spacing: 0.01em;
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    line-height: 1;
    white-space: nowrap;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    border: 1px solid var(--gold);
    color: var(--gold);
    transition: all .25s ease;
    background: transparent;
  }
  .btn:hover { background: var(--gold); color: var(--bg); }
  .btn.solid { background: var(--gold); color: var(--bg); }
  .btn.solid:hover { background: var(--gold-bright); border-color: var(--gold-bright); }
  .btn.ghost { border-color: rgba(245,241,232,0.25); color: var(--cream); }
  .btn.ghost:hover { background: var(--cream); color: var(--bg); border-color: var(--cream); }

  /* Section spacing */
  section { padding: 120px 0; }
  @media (max-width: 1024px) { section { padding: 88px 0; } }
  @media (max-width: 720px)  { section { padding: 64px 0; } }

  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 40px; margin-bottom: 64px;
  }
  .section-head .title { font-size: 64px; line-height: 1.05; max-width: 720px; }
  @media (max-width: 1024px) {
    .section-head { flex-direction: column; align-items: flex-start; gap: 24px; margin-bottom: 48px; }
    .section-head .title { font-size: 48px; }
  }
  @media (max-width: 720px) {
    .section-head { margin-bottom: 36px; gap: 18px; }
    .section-head .title { font-size: 34px; }
  }

  /* Responsive grid helpers — apply class + breakpoint kicks in */
  .rg-4, .rg-3, .rg-2 { display: grid; }
  .rg-4 { grid-template-columns: repeat(4, 1fr); }
  .rg-3 { grid-template-columns: repeat(3, 1fr); }
  .rg-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1024px) {
    .rg-4 { grid-template-columns: repeat(2, 1fr); }
    .rg-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .rg-4, .rg-3, .rg-2 { grid-template-columns: 1fr; }
  }
  /* hide on mobile / show only on mobile */
  .hide-mobile { }
  .only-mobile { display: none; }
  @media (max-width: 720px) {
    .hide-mobile { display: none !important; }
    .only-mobile { display: block; }
    .only-mobile.flex { display: flex; }
  }

  /* Number plates */
  .num {
    font-family: var(--serif);
    font-style: italic;
    color: var(--gold);
    font-size: 14px;
    margin-right: 12px;
  }

  /* Smoke decoration */
  .smoke-bg {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 80% 20%, rgba(200,169,106,0.06), transparent 40%),
      radial-gradient(circle at 10% 80%, rgba(185,28,28,0.05), transparent 45%);
  }

  /* Animation: subtle reveal */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.7s cubic-bezier(.2,.7,.2,1) both; }

  /* Page transitions */
  .page { animation: fadeUp 0.4s ease both; }

  /* No focus outline garbage */
  :focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }
</style>
</head>
