<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabaco &amp; Ron — El ritual del puro · Ciudad de Panamá</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;700;900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500&display=swap" rel="stylesheet">

<style>
  /* ════════════════════════════════════════════
     PALETA MÁRMOL & ORO — Tema claro
     (Manual oficial 2025 · Tabaco & Ron Panamá)
     ════════════════════════════════════════════ */
  :root {
    /* Fondos — blanco mármol cálido */
    --bg:        #F5F1EA;   /* Crema mármol cálido (base) */
    --bg-2:      #EFE9DC;   /* Capa secundaria, ligeramente más cálida */
    --bg-3:      #1F1D1B;   /* Grafito profundo para secciones de inversión */
    --paper:     #FAF6EE;   /* Papel — para cards */

    /* Texto */
    --ink:       #1F1D1B;   /* Grafito principal */
    --ink-2:     #4A4A52;   /* Acero — texto secundario */
    --ink-mute:  #7A746A;   /* Plata cálida — metadatos */
    --ink-soft:  #A89F90;   /* Plata clara */

    /* Acento — Oro Añejo */
    --gold:      #B08545;   /* Oro envejecido más profundo, legible sobre cream */
    --gold-pure: #C4A862;   /* Oro Añejo del manual (para fondos oscuros) */
    --gold-soft: #D9C28C;

    /* Rojo — sólo logo (legado del manual) */
    --red:       #B91C1C;
    --red-deep:  #8A0F0F;

    /* Líneas */
    --line:      rgba(31,29,27,0.12);
    --line-strong: rgba(31,29,27,0.32);
    --line-gold: rgba(176,133,69,0.30);

    /* Tipografía */
    --serif:     Georgia, 'Times New Roman', 'Bodoni Moda', serif;
    --sans:      'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  img { display: block; max-width: 100%; }
  h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; line-height: 1.65; }
  ::selection { background: var(--gold); color: var(--paper); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(31,29,27,0.18); border-radius: 0; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  #root { min-height: 100vh; }

  /* Container */
  .container { max-width: 1480px; margin: 0 auto; padding: 0 56px; }
  @media (max-width: 1024px) { .container { padding: 0 32px; } }
  @media (max-width: 720px)  { .container { padding: 0 20px; } }

  /* Tipografía editorial */
  .eyebrow {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .eyebrow.ink  { color: var(--ink); }
  .eyebrow.mute { color: var(--ink-mute); }
  .eyebrow.gold { color: var(--gold); }

  .hairline { height: 1px; background: var(--line); width: 100%; }
  .hairline-gold { height: 1px; background: var(--gold); width: 40px; }

  /* ───── Placeholder editorial — gradiente Acero (manual) ───── */
  .ph {
    position: relative;
    overflow: hidden;
    background: #4A4A52;          /* Acero — base */
    color: var(--gold-pure);
    isolation: isolate;
  }
  /* Decoración base — gradiente Acero → Grafito */
  .ph::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(196,168,98,0.18) 0%, rgba(196,168,98,0) 55%),
      linear-gradient(160deg, #5C5C66 0%, #4A4A52 45%, #2A2A2E 100%);
    z-index: 0;
  }
  .ph::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(245,241,234,0.04) 0 1px, transparent 1px 16px);
    z-index: 1;
  }
  .ph-label {
    position: absolute;
    bottom: 14px; left: 14px;
    z-index: 5;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(245,241,234,0.7);
    text-transform: uppercase;
    padding: 5px 10px;
    border: 1px solid rgba(245,241,234,0.22);
    background: rgba(31,29,27,0.55);
    backdrop-filter: blur(2px);
  }
  .ph-glyph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 2;
    color: rgba(196,168,98,0.34);
    font-family: var(--serif);
    font-style: italic;
    font-size: 120px;
    letter-spacing: -0.04em;
    pointer-events: none;
  }
  .ph-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    /* Tratamiento noir cálido sobre el acero */
    filter: sepia(0.25) brightness(0.85) contrast(1.08) saturate(0.92);
  }
  .ph-overlay {
    position: absolute; inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(196,168,98,0.14), transparent 60%),
      linear-gradient(180deg, rgba(31,29,27,0.10) 0%, rgba(31,29,27,0.45) 100%);
    pointer-events: none;
  }
  /* Modo producto (cream marfil, pieza centrada) — sin cambios, sigue claro */
  .ph.ph-product {
    background: linear-gradient(180deg, #F8F2E2 0%, #ECE2C8 100%);
  }
  .ph.ph-product::before {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(80,55,30,0.10), transparent 60%);
  }
  .ph.ph-product::after { display: none; }
  .ph-img-product {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    z-index: 2;
    padding: 10%;
    filter: drop-shadow(0 18px 28px rgba(40,20,10,0.22));
  }
  /* Variantes — todas sobre Acero/Grafito */
  .ph.warm::before {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(196,168,98,0.32) 0%, rgba(196,168,98,0) 55%),
      linear-gradient(160deg, #6E5F44 0%, #4A4136 50%, #2A2520 100%);
  }
  .ph.smoke::before {
    background:
      radial-gradient(ellipse at 30% 50%, rgba(200,200,208,0.18) 0%, transparent 60%),
      linear-gradient(160deg, #5C5C66 0%, #3A3A40 100%);
  }
  .ph.crimson::before {
    background:
      radial-gradient(ellipse at 35% 55%, rgba(185,28,28,0.22) 0%, transparent 55%),
      linear-gradient(160deg, #4A2E2E 0%, #2A1818 100%);
  }
  .ph.dark::before {
    background:
      radial-gradient(ellipse at 30% 30%, rgba(196,168,98,0.28), transparent 55%),
      linear-gradient(180deg, #2A2723 0%, #15130F 100%);
  }
  .ph.dark::after {
    background-image:
      repeating-linear-gradient(45deg, rgba(245,241,234,0.04) 0 1px, transparent 1px 16px);
  }
  .ph.dark .ph-label {
    color: rgba(245,241,234,0.65);
    border-color: rgba(245,241,234,0.18);
    background: rgba(31,29,27,0.55);
  }
  .ph.dark .ph-glyph {
    color: rgba(196,168,98,0.32);
  }

  /* ───── Logo rojo (mantenido del legado) ───── */
  .logo-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: #F5F1EA;
    font-family: var(--serif);
    font-weight: 700;
    font-style: italic;
    border-radius: 999px;
    padding: 7px 18px 9px;
    letter-spacing: 0.005em;
    box-shadow: 0 2px 0 rgba(138,15,15,0.5), 0 8px 18px rgba(185,28,28,0.12);
    line-height: 1;
    white-space: nowrap;
  }

  /* ───── Botones ───── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 26px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    border: 1px solid var(--ink);
    color: var(--ink);
    transition: all .25s ease;
    background: transparent;
    cursor: pointer;
  }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn.solid:hover { background: var(--gold); border-color: var(--gold); color: #1F1D1B; }
  .btn.gold { border-color: var(--gold); color: var(--gold); }
  .btn.gold:hover { background: var(--gold); color: var(--paper); }
  .btn.gold.solid { background: var(--gold); color: var(--paper); }
  .btn.gold.solid:hover { background: #9C7237; border-color: #9C7237; }
  .btn.ghost { border-color: var(--line-strong); color: var(--ink-2); }
  .btn.ghost:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Tweak: CTA dorado — sobreescribe los botones solid */
  body.cta-gold .btn.solid {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--paper);
  }
  body.cta-gold .btn.solid:hover {
    background: #9C7237;
    border-color: #9C7237;
    color: var(--paper);
  }

  /* Section spacing */
  section { padding: 120px 0; }
  @media (max-width: 1024px) { section { padding: 88px 0; } }
  @media (max-width: 720px)  { section { padding: 64px 0; } }

  /* Section head */
  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 40px; margin-bottom: 64px;
  }
  .section-head .title { font-size: 68px; line-height: 1.02; max-width: 760px; }
  @media (max-width: 1024px) {
    .section-head { flex-direction: column; align-items: flex-start; gap: 24px; margin-bottom: 48px; }
    .section-head .title { font-size: 48px; }
  }
  @media (max-width: 720px) {
    .section-head { margin-bottom: 36px; gap: 18px; }
    .section-head .title { font-size: 36px; }
  }

  /* Grids */
  .rg-4, .rg-3, .rg-2 { display: grid; }
  .rg-4 { grid-template-columns: repeat(4, 1fr); }
  .rg-3 { grid-template-columns: repeat(3, 1fr); }
  .rg-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1024px) {
    .rg-4 { grid-template-columns: repeat(2, 1fr); }
    .rg-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .rg-4, .rg-3, .rg-2 { grid-template-columns: 1fr; }
  }

  /* Animaciones */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 0.7s cubic-bezier(.2,.7,.2,1) both; }
  .page { animation: fadeUp 0.4s ease both; }

  /* Fade-in solo de opacidad — para elementos con backdrop-filter,
     que no tolera un transform en un ancestro */
  @keyframes fadeOnlyIn { from { opacity: 0; } to { opacity: 1; } }
  .fade-opacity { opacity: 0; animation: fadeOnlyIn 0.9s cubic-bezier(.2,.7,.2,1) both; }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(36px); transition: opacity 1s cubic-bezier(.2,.7,.2,1), transform 1s cubic-bezier(.2,.7,.2,1); }
  .reveal.is-visible { opacity: 1; transform: none; }
  .reveal-up   { transform: translateY(48px); }
  .reveal-down { transform: translateY(-32px); }
  .reveal-left  { transform: translateX(-48px); }
  .reveal-right { transform: translateX(48px); }
  .reveal-zoom  { transform: scale(0.94); }
  .reveal.is-visible.reveal-left,
  .reveal.is-visible.reveal-right,
  .reveal.is-visible.reveal-zoom,
  .reveal.is-visible.reveal-up,
  .reveal.is-visible.reveal-down { transform: none; }
  .reveal-d1 { transition-delay: .08s; }
  .reveal-d2 { transition-delay: .16s; }
  .reveal-d3 { transition-delay: .24s; }
  .reveal-d4 { transition-delay: .32s; }
  .reveal-d5 { transition-delay: .40s; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; }
  }

  /* Letter-by-letter reveal for the hero headline */
  @keyframes letterIn {
    from { opacity: 0; transform: translateY(40px); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  .letters > span {
    display: inline-block;
    opacity: 0;
    animation: letterIn 0.9s cubic-bezier(.2,.7,.2,1) both;
  }

  /* Float / drift loops for decorative imagery */
  @keyframes drift-y { 0% { transform: translateY(0); } 50% { transform: translateY(-14px); } 100% { transform: translateY(0); } }
  @keyframes drift-x { 0% { transform: translateX(0); } 50% { transform: translateX(10px); } 100% { transform: translateX(0); } }
  @keyframes spin-slow { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes pulse-soft { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  .float-y { animation: drift-y 9s ease-in-out infinite; }
  .float-x { animation: drift-x 11s ease-in-out infinite; }

  /* Marquee */
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-track { display: flex; gap: 64px; width: max-content; animation: marquee 40s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }

  /* Decorative blob */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .blob.gold { background: radial-gradient(circle, rgba(196,168,98,0.55) 0%, rgba(196,168,98,0) 70%); }
  .blob.warm { background: radial-gradient(circle, rgba(217,194,140,0.40) 0%, rgba(217,194,140,0) 70%); }
  .blob.smoke { background: radial-gradient(circle, rgba(31,29,27,0.18) 0%, rgba(31,29,27,0) 70%); }

  /* Decorative blurred photo */
  .photo-blur {
    position: absolute;
    overflow: hidden;
    filter: blur(2px) saturate(1.05);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .photo-blur::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(245,241,234,0.4), rgba(245,241,234,0.8));
  }
  .photo-blur img { width: 100%; height: 100%; object-fit: cover; }

  /* Focus */
  :focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }

  /* Decoración: rombos dorados (separador inline del manual) */
  .diamond {
    display: inline-block;
    width: 4px; height: 4px;
    background: var(--gold);
    transform: rotate(45deg);
    vertical-align: middle;
    margin: 0 12px;
  }

  /* Card paper */
  .card-paper {
    background: var(--paper);
    border: 1px solid var(--line);
  }

  /* Texto grande inverso para secciones oscuras */
  .inverse { background: var(--bg-3); color: var(--paper); }
  .inverse h1, .inverse h2, .inverse h3 { color: var(--paper); }

  /* Marca de agua decorativa */
  .watermark {
    position: absolute;
    font-family: var(--serif);
    font-style: italic;
    color: rgba(176,133,69,0.06);
    font-size: clamp(180px, 28vw, 380px);
    line-height: 1;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    letter-spacing: -0.04em;
  }

  /* Slim divider with diamond */
  .divider-diamond {
    display: flex; align-items: center; gap: 14px;
  }
  .divider-diamond::before, .divider-diamond::after {
    content: ''; flex: 1; height: 1px; background: var(--line-gold);
  }
</style>
